aid: engine-ml
name: Engine ML
description: >-
  Engine ML was a machine-learning infrastructure startup (founded 2018, backed
  by Kleiner Perkins) that offered a hosted platform for distributed model
  training and experiment tracking. Its product surface centered on the `engine`
  command-line tool and the `eml` Python library, which let data scientists
  launch experiments, track code, system utilization, logs, and output files,
  and run image classifiers (PyTorch/TensorFlow/Keras) against datasets such as
  MNIST. The company appears to be defunct: engineml.com serves an empty page
  behind an expired TLS certificate (expired March 2023), the documentation site
  docs.engineml.com returns an empty S3 bucket, and the public GitHub
  organization (EngineML) has not been updated since 2020-2021. No live API,
  OpenAPI description, package-registry release, or reachable developer docs
  could be found. This profile preserves the historical identity and the still-
  live GitHub organization as the only verifiable surviving surface.
